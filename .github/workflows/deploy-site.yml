name: Deploy resume site to Pages
on:
  push:
    branches: [main]
    paths:
      - "sites/dev-resume/**"
      - "data/resume.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/dev-resume/package-lock.json
      - name: Build generalist resume variant
        working-directory: sites/dev-resume
        run: ./scripts/build-resume.py generalist
      - name: Install site dependencies
        working-directory: sites/dev-resume
        run: npm ci
      - name: Build site
        working-directory: sites/dev-resume
        run: hugo --minify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/dev-resume/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
