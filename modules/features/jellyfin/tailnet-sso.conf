# nginx location config for the jellyfin vhost: inject remote-auth
# identity headers for tailnet sources only.
#
# Tailnet-only vhost (AT-4BDM strip, transmission.nix pattern): the name
# carries no public DNS record (ddclient list) — it resolves only on the
# tailnet via split-DNS (tailnet-dns.nix), and nginx refuses every other
# source outright. LAN clients reach jellyfin directly on :8096.
#
# The secret comes from the jellyfin-remoteauth-nginx.conf sops
# template (root:nginx 0440 — the nginx config test runs as the nginx
# user, so root-only files fail it). $tailnet_source is the geo flag
# from nginx.nix (100.64.0.0/10, the Tailscale CGNAT range).
#
# proxy_set_header always replaces any client-supplied header of the
# same name, and nginx omits headers whose value is empty — so
# non-tailnet sources send none of the three headers and cannot forge
# them.

include /run/secrets/rendered/jellyfin-remoteauth-nginx.conf;
set $remoteauth_secret_send "";
set $remoteauth_user "";
set $remoteauth_groups "";
if ($tailnet_source) {
    set $remoteauth_secret_send $remoteauth_secret;
    set $remoteauth_user "john";
    set $remoteauth_groups "tailnet";
}
proxy_set_header X-Remote-Auth-Secret $remoteauth_secret_send;
proxy_set_header X-Remote-Auth-User $remoteauth_user;
proxy_set_header X-Remote-Auth-Groups $remoteauth_groups;

# Access gate: tailnet sources only. (The identity-header injection
# above stays conditional so headers are never sent if the allow list
# is ever widened beyond the tailnet.)
allow 100.64.0.0/10;
deny all;
