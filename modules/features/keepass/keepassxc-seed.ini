; Seed for ~/.config/keepassxc/keepassxc.ini — copied ONCE on first
; activation (tmpfiles C+, copy-if-absent); afterwards the live file is
; preserved state and user edits always win over this seed.
; Key names mirror KeePassXC src/core/Config.cpp, "Roaming" group.
[Browser]
Enabled=true

[GUI]
; Tray-resident for the systemd keepassxc.service (app process serves the
; browser integration; noctalia's bar is the StatusNotifierWatcher).
ShowTrayIcon=true
MinimizeToTray=true
MinimizeOnStartup=true
MinimizeOnClose=true
